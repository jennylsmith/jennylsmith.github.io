project:
  type: website
  output-dir: docs
  # render the site pages only; assets/notes.md is a working file, not a page
  render:
    - "**/*.qmd"
    - "!assets/notes.md"

website:
  page-navigation: true
  site-url: "https://jennylsmith.github.io"
  repo-url: "https://github.com/jennylsmith/jennylsmith.github.io"
  description: "Jenny Leopoldina Smith, MSc. Computational biologist working in cancer genomics, Nextflow pipeline development, and next generation sequencing (NGS) data analysis."
  image: "assets/balsamroot_flowers.jpeg"
  open-graph: true
  twitter-card: true
  navbar:
    search: true
    background: "#008080"
    tools:
      - icon: github
        menu:
          - text: Source Code
            href:  https://github.com/jennylsmith/jennylsmith.github.io
          - text: Report a Bug
            href:  https://github.com/jennylsmith/jennylsmith.github.io/issues
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Resume"
        id: "Resume"
        href: resume/resume.qmd
      - text: "Projects"
        menu: 
          - text: "Data visualization"
            href: projects/data_visualization.qmd
          - text: "Genomics pipelines and tools"
            href: projects/genomics_applications_pipelines.qmd
          - text: "Select publications"
            href: projects/publications.qmd
format:
  html:
    theme: 
      - custom.scss
      - lumen
    grid:
      sidebar-width:	150px
      body-width:	875px
      margin-width:	200px
      gutter-width:	1em
    toc: true
    toc-depth: 1
    link-external-newwindow: true


